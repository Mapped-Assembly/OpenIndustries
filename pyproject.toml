[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-industries"
version = "0.1.1"
description = "Static Open Industries scene exporter for georeferenced 3D Tiles"
readme = {file = "tools/geospatial/README.md", content-type = "text/markdown"}
license = {file = "tools/geospatial/LICENSE"}
requires-python = ">=3.11"
authors = [{name = "Mapped Assembly"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
physics = ["mujoco==4.0.1"]
native-render = ["pygfx==0.18.0", "wgpu==0.33.0", "rendercanvas==3.0.1", "imageio==2.38.2"]

[project.urls]
Homepage = "https://github.com/Mapped-Assembly/Open-Industries"
Repository = "https://github.com/Mapped-Assembly/Open-Industries"
Issues = "https://github.com/Mapped-Assembly/Open-Industries/issues"

[project.scripts]
oi-export-scene = "export_scene:main"
oi-render-scene = "native_render:main"

[tool.setuptools]
package-dir = {"" = "tools/geospatial"}
py-modules = ["export_scene", "native_render", "native_animation", "native_physics", "native_mujoco_scene", "native_trajectory", "json_workcell"]
