name: FIELD-LAB-01 benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay:
    name: Replay (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:field-lab
      - run: npm run test:field-lab-scene
      - name: Replay FIELD-LAB-01
        run: node benchmarks/field-lab/run.mjs deliverables/field-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-lab-replay-${{ matrix.os }}
          path: deliverables/field-lab
          if-no-files-found: warn

  render:
    name: Native import and render evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:field-lab-scene
      - run: npm run test:field-lab-scene-browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: TheRobotStudio/SO-ARM100
          ref: a758567c3978dfeefe282ede0500085a48fe8f78
          path: so101-source
          sparse-checkout: |
            Simulation/SO101
            LICENSE
          sparse-checkout-cone-mode: false
      - name: Local embodied controller and browser path
        run: |
          python -m pip install -r services/embodied/requirements.txt
          npm run build
          SO101_SOURCE_ROOT="$PWD/so101-source" PYTHONPATH=services/embodied python -m unittest discover -s services/embodied/tests -v
          SO101_SOURCE_ROOT="$PWD/so101-source" npm run test:embodied-browser
          npm run test:cabinet-scene
          SO101_SOURCE_ROOT="$PWD/so101-source" npm run test:cabinet-browser
          SO101_SOURCE_ROOT="$PWD/so101-source" npm run test:cabinet-joint-browser
          npm run demo:cabinet-joint
      - name: Replay and render FIELD-LAB-01
        run: node benchmarks/field-lab/run.mjs deliverables/field-lab --render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-lab-render-evidence
          path: |
            deliverables/field-lab
            deliverables/embodied
            deliverables/cabinet
            deliverables/cabinet-joint
          if-no-files-found: warn

  motion-handoff:
    name: Pinned OpenCAD motion handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mapped-Assembly/OpenCAD
          ref: 9c0c6dc0b5794debdfb8c7507078bae3303dd8bd
          path: opencad-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e opencad-source/packages/opencad
      - run: python benchmarks/field-lab/export-motion.py --opencad-source opencad-source
      - run: git diff --exit-code -- benchmarks/field-lab/fixtures/pipette-motion.json
