name: Local persistent runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use official HTTPS Ubuntu mirrors for browser dependencies
        shell: bash
        run: |
          mirror_list=/etc/apt/apt-mirrors.txt
          # The regional mirror stalled this native systemd job before tests ran.
          # Verify the hosted-runner layout before removing only that mirror.
          if [[ ! -f "$mirror_list" || -L "$mirror_list" ]] ||
             ! cmp -s "$mirror_list" <(printf '%s\t%s\n' \
               'http://azure.archive.ubuntu.com/ubuntu/' 'priority:1' \
               'https://archive.ubuntu.com/ubuntu/' 'priority:2' \
               'https://security.ubuntu.com/ubuntu/' 'priority:3'); then
            echo '::notice::Unrecognized Ubuntu APT mirror layout; keeping runner configuration and continuing dependency installation.'
          else
            sudo sed -i '1d' "$mirror_list"
            cat "$mirror_list"
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local-runtime
        env:
          OI_TEST_BROWSER: 'true'
      - run: systemd-analyze verify deploy/local-runtime/oi-local.service
      - run: bash scripts/local-runtime-systemd-smoke.sh
      - name: Service diagnostics
        if: always()
        run: |
          sudo systemctl status oi-local --no-pager || true
          sudo journalctl --namespace=oi-local -u oi-local -n 100 --no-pager || true
