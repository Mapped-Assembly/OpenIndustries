name: Game runtime Windows full
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-runtime-windows-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full:
    name: Windows full regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build material-science package
        run: npm run build:materials
      - name: Verify committed material-science output
        run: git diff --exit-code -- packages/material-science/dist
      - name: Verify suite inventory, concurrency and failure reporting
        run: python -m unittest scripts/test_ci_game_suites.py -v
      # The full profile is OS-independent: all eight suites also run on Ubuntu PRs.
      - name: All eight suites on Windows (two processes)
        run: npm run ci:game:ubuntu
