name: Human POV walkthrough
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pov:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and deterministic POV/clip-depth checks
        run: |
          npm run build
          npm run test:pov-camera
          npm run test:pov-capture
          npm run test:mounted-pov
          npm run test:camera-depth
      - run: npx playwright install --with-deps chromium
      - name: Browser walkthrough, switch, and session restoration
        shell: bash
        run: |
          npm start > /tmp/openindustries-pov.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=0
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/openindustries-pov.log; exit 1; fi
          npm run test:pov-browser
          npm run test:pov-capture-browser
          npm run test:mounted-pov-browser
      - name: Server diagnostic output on failure
        if: failure()
        run: cat /tmp/openindustries-pov.log || true
