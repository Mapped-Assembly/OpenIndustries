name: Game runtime
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep push-to-main validation, but cancel obsolete iterations of the same PR.
concurrency:
  group: game-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Browser change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.detect.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify conservative browser change filter
        run: python3 -m unittest scripts/test_ci_browser_changes.py scripts/test_ci_run_metrics.py -v
      - name: Classify changes
        id: detect
        env:
          OI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_browser_changes.py

  ubuntu-suite:
    name: Ubuntu suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build material-science package
        run: npm run build:materials
      - name: Verify committed material-science output
        run: git diff --exit-code -- packages/material-science/dist
      - name: Verify suite inventory, concurrency and failure reporting
        run: python3 -m unittest scripts/test_ci_game_suites.py -v
      - name: All Ubuntu suites (two processes, named output and timings)
        run: npm run ci:game:ubuntu

  windows-compat:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build material-science package
        run: npm run build:materials
      - name: Verify committed material-science output
        run: git diff --exit-code -- packages/material-science/dist
      - name: Verify suite inventory, concurrency and failure reporting
        run: python -m unittest scripts/test_ci_game_suites.py -v
      - name: Windows native and process compatibility (two processes)
        run: npm run ci:game:windows

  downstream-browser:
    needs: changes
    # Only an explicit successful docs-only classification may skip this job.
    # A failed detector must not suppress integration coverage; cancellation still stops it.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Match the pinned client's Playwright 1.63.0. This includes browsers, OS
    # libraries and fonts, avoiding the measured eight-minute apt mirror stall.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: isayahc/tower-defense
          ref: 831085fec8a2638ef8a668b5d8de195bb1462bfb
          path: .integration/tower-defense
      - name: Use the workspace path inside the container
        run: printf 'OI_CHECKOUT=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .integration/tower-defense/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: .integration/tower-defense
      - run: npm run check:materials
        working-directory: .integration/tower-defense
      - name: Verify Playwright package matches the pinned browser image
        run: node -e "const v = require('playwright/package.json').version; if (v !== '1.63.0') throw new Error('Update the pinned Playwright image for package version ' + v)"
        working-directory: .integration/tower-defense
      # Each command owns its DB, service ports and screenshot names. The full
      # match retains its internal gesture -> real-time two-client sequence.
      - name: Downstream suites (two isolated processes, named output and timings)
        run: npm run ci:game:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adopted-runtime-desktop-mobile-evidence
          path: .integration/tower-defense/test-results/
          if-no-files-found: ignore
          retention-days: 7
