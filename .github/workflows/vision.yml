name: Camera and OpenCV observations
on:
  pull_request:
    paths:
      - 'services/vision/**'
      - 'deploy/inspection/**'
      - 'deploy/farm/**'
      - 'server/mcp-farm.mjs'
      - 'server/*vision*'
      - 'server/mcp-agent.mjs'
      - 'server/openindustries-mcp.mjs'
      - 'server/astra-mcp.mjs'
      - 'server/oi-environment.*'
      - 'package*.json'
      - '.github/workflows/vision.yml'
  push:
    branches: [main]
    paths:
      - 'services/vision/**'
      - 'deploy/inspection/**'
      - 'deploy/farm/**'
      - 'server/mcp-farm.mjs'
      - 'server/*vision*'
      - 'server/mcp-agent.mjs'
      - 'server/openindustries-mcp.mjs'
      - 'server/astra-mcp.mjs'
      - 'server/oi-environment.*'
      - 'package*.json'
      - '.github/workflows/vision.yml'
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install ./services/vision
      - run: python -m unittest discover -s services/vision/tests -v
        env:
          OI_VISION_MCP_TESTS: '1'
      - run: npm run test:mcp
      - run: bash -n deploy/inspection/install.sh deploy/inspection/mcp.sh deploy/inspection/record.sh
      - run: python -m pip install cfn-lint==1.58.0
      - run: cfn-lint deploy/inspection/station.cfn.json
      - run: bash -n deploy/farm/install.sh deploy/farm/mcp.sh
      - name: Test original sample-farm models and OpenCV control gates
        if: matrix.python == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
          git clone https://github.com/isayahc/Spooky-Civic-AI-Hackathon.git /tmp/oi-farm-source
          git -C /tmp/oi-farm-source checkout --detach 523d1f5a54b5b279d6d2ae9fcb8b5315b15573aa
          python -m pip install --require-hashes -r deploy/farm/requirements.lock
          python -m unittest discover -s services/vision/tests -p test_farm.py -v
        env:
          OI_FARM_SOURCE: /tmp/oi-farm-source
          MUJOCO_GL: egl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
